services:
  - type: web
    name: find-your-7-twins-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://gkt.com.np
      - key: FRONTEND_RESET_URL
        value: https://gkt.com.np/twins/
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: ACCESS_TOKEN_DAYS
        value: "30"
      - key: DEV_RESET_MODE
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
