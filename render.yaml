services:
  - type: web
    name: find-your-7-twins-api
    runtime: docker
    plan: 2c-4g
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: twins-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: find-your-7-twins-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://gkt.com.np
      - key: FRONTEND_RESET_URL
        value: https://gkt.com.np/twins/
      - key: STORAGE_DIR
        value: /data
      - key: INSIGHTFACE_ROOT
        value: /data/insightface
      - key: INSIGHTFACE_MODEL
        value: buffalo_l
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: ACCESS_TOKEN_DAYS
        value: "30"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DEV_RESET_MODE
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: find-your-7-twins-db
    plan: 0.5c-1g
    region: singapore
    diskSizeGB: 5
